name: Publish FreeCut editor surface

# Publishes @quantfive/freecut-editor-surface to the public npmjs registry
# (the canonical release target; publishConfig in packages/freecut-editor
# points there and scripts/package-editor-surface.mjs enforces it). Requires
# an NPM_TOKEN repo secret (npm automation token with publish rights on the
# @quantfive scope); until a repo admin adds it, use the manual maintainer
# path instead: npm run publish:editor-surface:npmjs

on:
  workflow_dispatch:
  push:
    tags:
      - 'freecut-editor-surface-v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-freecut-editor-surface
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @quantfive/freecut-editor-surface
    # Manual runs are intentionally limited to staging; tag pushes are
    # already constrained by the trigger below and must match the package
    # version in the validation step.
    if: github.event_name == 'push' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Select pinned npm
        run: npm install --global npm@11.8.0

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify provenance
        run: npm run verify:provenance

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#freecut-editor-surface-v}"
          package_version="$(node -p "require('./packages/freecut-editor/package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != freecut-editor-surface-v* || "${tag_version}" != "${package_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must match package version ${package_version}." >&2
            exit 1
          fi

      - name: Build deterministic package artifact
        run: npm run package:editor-surface

      - name: Verify packed artifact as an installed consumer
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./packages/freecut-editor/package.json').version")"
          artifact="artifacts/freecut-editor-surface-${package_version}.tgz"
          test -f "${artifact}"
          npm run test:editor-surface:consumer -- --artifact "${artifact}"

      - name: Publish public package to npmjs
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./packages/freecut-editor/package.json').version")"
          artifact="artifacts/freecut-editor-surface-${package_version}.tgz"
          test -f "${artifact}"
          # publishConfig in the manifest already targets npmjs with public
          # access; the explicit flags keep this step robust against manifest
          # drift (the pack gate also asserts them).
          npm publish "./${artifact}" --registry=https://registry.npmjs.org --access=public
